description = "Run a table, reconciliation, HS-code, or China-reachability job through deterministic hosted tools"

prompt = """
Invoke the netcafe skill.

Use it when the task involves any of these, and the answer has to be checkable rather
than plausible:

- Reconciling a bank statement against a ledger, especially with no shared reference number
- Comparing two spreadsheets or tables on a key column
- Reading or writing .xlsx where dates and leading zeros must survive
- Finding records that are probably the same company under different names
- Looking up or classifying a US HS/HTS tariff code
- Checking whether a site is reachable from mainland China

Do not inline this work. Floating point turns 0.1+0.2 into a phantom difference, `007`
becomes `7`, a date becomes `45123`, and an accounting negative `(100.00)` reads as `+100`.
The hosted tools handle those cases and return an arithmetic self-check computed in code.

Read `counts` and `arithmetic_check` before reporting anything. If a self-check fails,
say so rather than presenting the table as settled.
"""
